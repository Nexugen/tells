# tells.nexugen.app -> the tells API on 127.0.0.1:3791.
# An exact server_name wins over the platform's *.nexugen.app wildcard, so this block
# takes only this one host and leaves every other subdomain alone.
limit_req_zone $binary_remote_addr zone=tells_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tells.nexugen.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tells.nexugen.app;

    ssl_certificate     /etc/letsencrypt/live/nexugen.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexugen.app/privkey.pem;

    client_max_body_size 1m;

    location / {
        limit_req zone=tells_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
}
